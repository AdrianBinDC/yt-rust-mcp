[package]
name = "yt-rust-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Read-only YouTube Data API v3 MCP server"

[dependencies]
rmcp = { version = "3.8", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "io-std",
  "io-util",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "blocking",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
jiff = { version = "0.2", features = ["static"] }
dirs = "7"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_yaml = "0.9"
dotenvy = "0.15.7"
clap = { version = "4", features = ["derive"] }
axum = "0.8"

[dev-dependencies]
http = "1"
tower = "0.5"
